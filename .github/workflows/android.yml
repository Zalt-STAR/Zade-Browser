name: Android build

# Builds the Android APK. A Chromium compile does not fit in one six-hour job,
# so eight machines first compile an eighth of the object files each and pool
# what they add to the compiler cache. Chained passes then build the APK from
# that cache, each saving it and handing over to the next until the APK is
# built or a real error stops it. Logs go to the android-build-logs branch.

on:
  push:
    branches: [android-build]
    paths-ignore:
      - '**.md'

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  shards:
    # Off while the pooled compiler cache from run 5 is warm: every object is
    # already cached, so the shards would only replay it. Turn this back on
    # (delete the next line) after anything that invalidates the cache, such as
    # a new Chromium version or changed compiler flags.
    if: false
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    uses: ./.github/workflows/android-stage.yml
    with:
      stage: 0
      shard: ${{ matrix.shard }}
      shard_total: 8
  stage1:
    needs: shards
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/android-stage.yml
    with:
      stage: 1
      merge_deltas: true
  stage2:
    needs: stage1
    if: needs.stage1.outputs.status == 'timeout'
    uses: ./.github/workflows/android-stage.yml
    with:
      stage: 2
  stage3:
    needs: stage2
    if: needs.stage2.outputs.status == 'timeout'
    uses: ./.github/workflows/android-stage.yml
    with:
      stage: 3
  stage4:
    needs: stage3
    if: needs.stage3.outputs.status == 'timeout'
    uses: ./.github/workflows/android-stage.yml
    with:
      stage: 4
  stage5:
    needs: stage4
    if: needs.stage4.outputs.status == 'timeout'
    uses: ./.github/workflows/android-stage.yml
    with:
      stage: 5
  stage6:
    needs: stage5
    if: needs.stage5.outputs.status == 'timeout'
    uses: ./.github/workflows/android-stage.yml
    with:
      stage: 6
